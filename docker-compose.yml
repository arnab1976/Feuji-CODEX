# One command:  docker compose up --build   →  http://localhost:8000
# With PostgreSQL: docker compose --profile postgres up --build  (and set CODEX_DATABASE_URL below)
services:
  codex:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes: ["codex-data:/data"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    volumes: ["pg-data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

volumes:
  codex-data:
  pg-data:
